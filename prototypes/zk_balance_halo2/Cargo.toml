[package]
name = "wam-privacy-halo2-prototype"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
blake2b_simd = "1"
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "getrandom", "chacha", "x25519", "hkdfsha2"] }
zeroize = "1"
ff = "0.13"
halo2_proofs = { version = "0.3.5", default-features = false }
halo2_gadgets = { version = "0.5.0", default-features = false }

[dev-dependencies]
halo2_proofs = { version = "0.3.5", default-features = false, features = ["dev-graph"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
