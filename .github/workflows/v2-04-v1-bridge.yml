name: V2-04 - Frozen V1 integration and regression bridge

on:
  push:
    branches:
      - v2/04-v1-regression-bridge
  pull_request:
    paths:
      - 'v2/**'
      - 'docs/v2/**'
      - '.github/workflows/v2-04-v1-bridge.yml'
      - 'prototypes/**'
      - 'integration/core/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-v1-signer-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compile V2-04 bridge and inherited V2 fixtures
        run: |
          python3 -m py_compile v2/bridge.py v2/test_bridge.py v2/test_wsp_bridge.py
          python3 -m py_compile v2/policy.py v2/disclosure.py v2/routing.py
      - name: Capability to frozen V1 signer gate tests
        env:
          PYTHONPATH: 'v2:prototypes'
        run: |
          python3 -m unittest -v v2.test_bridge v2.test_policy v2.test_disclosure v2.test_routing
      - name: Explicitly prohibit networking in V2 bridge
        run: |
          if grep -nE '(^import socket|^import requests|^import urllib|^import http|^from socket|^from requests|^from urllib|^from http|subprocess|os.system)' v2/bridge.py; then
            echo 'V2-04 signer bridge must not implement transport or shell execution'
            exit 1
          fi

  pinned-wsp-real-psbt:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout frozen V1 and V2 bridge
        uses: actions/checkout@v4
        with:
          path: repo
      - name: Checkout pinned WSP dependency
        uses: actions/checkout@v4
        with:
          repository: Urriki1502/wam-silent-payments
          ref: dcf1aecc00a64bfad3151fa202c3e07d47d83e69
          path: wsp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            wsp/requirements-dev.txt
            wsp/requirements-lock.txt
      - name: Install pinned WSP runtime
        working-directory: wsp
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-build-isolation . ./integration-deps/wam-sdk
      - name: Real frozen V1 PSBT and V2 capability integration tests
        working-directory: repo
        env:
          PYTHONPATH: 'v2:prototypes'
        run: |
          python -m unittest -v tests/test_phase12_real_adapters.py v2.test_wsp_bridge

  pinned-v1-rust-reorg-and-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy
      - name: Frozen V1 Rust format and no compiler warnings
        working-directory: prototypes/zk_balance_halo2
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Existing V1 atomic state and 300-block reorg
        working-directory: prototypes/zk_balance_halo2
        run: cargo test --locked --lib core_state::tests --verbose
      - name: Existing V1 scan rollback and restart-equivalent full rescan
        working-directory: prototypes/zk_balance_halo2
        run: cargo test --locked --test wallet_state --verbose
      - name: Existing V1 proof-verified state transitions and malicious proof
        working-directory: prototypes/zk_balance_halo2
        run: cargo test --locked --test core_state_proof --verbose
      - name: Existing V1 proof domain and key binding regression
        working-directory: prototypes/zk_balance_halo2
        run: cargo test --locked --test security_domain_binding --verbose

  v1-source-and-core-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require frozen V1 logical freeze pin ancestry
        run: |
          git merge-base --is-ancestor 95dfe0abf04b4e4dcbdbe9eb6d9bd0439a45a127 HEAD
      - name: Deny changes to V1 crypto, Core adapter, keys and tests
        run: |
          git diff --exit-code 95dfe0abf04b4e4dcbdbe9eb6d9bd0439a45a127 HEAD -- prototypes/ integration/core/ tests/ scripts/phase14d_static_review.py scripts/build_phase14d_ledger.py\n          git diff --exit-code 403fb4889c97a680f3deabdb2a1c0db3fb6c65fd HEAD -- scripts/
      - name: Restrict post-freeze changes to V2-only research paths
        run: |
          python3 - <<'PY'
          import subprocess
          base = "403fb4889c97a680f3deabdb2a1c0db3fb6c65fd"
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", base, "HEAD"], text=True
          ).splitlines()
          allowed = ("v2/", "docs/v2/", ".github/workflows/v2-")
          bad = [name for name in changed if not name.startswith(allowed)]
          if bad:
              raise SystemExit("Forbidden post-freeze paths: " + repr(bad))
          print("V1 runtime unchanged; V2-04 changes only:", len(changed), "paths")
          PY
      - name: Qualify V1 final audit without claiming independent review
        run: |
          python3 scripts/run_phase15f_v1_final_audit.py --root . --output /tmp/v1-final-audit.json
          python3 scripts/build_phase15_review_package.py --root . --output /tmp/v1-review-package.json
