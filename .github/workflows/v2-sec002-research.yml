name: SEC002 research journal
on:
  push:
    branches: [research/sec002-signer-journal]
  pull_request:
    branches: [v2/research-freeze-2026-10-09]
permissions:
  contents: read
jobs:
  defensive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify immutable signer and exact HEAD
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD:prototypes/signer_abstraction/provider.py)" = 3bd361bcfdd068a4fd2fa042acc283568673fb47
          test "$(git rev-parse HEAD:prototypes/signer_abstraction/model.py)" = b2bfb3032d49c472f7b9a8dc256925e4ad05029a
          mkdir -p evidence
          git rev-parse HEAD > evidence/head.txt
      - name: Restart crash concurrency and frozen regression
        run: |
          set -o pipefail
          python -m unittest v2.sec002_research.test_journal tests.test_phase3_signer_abstraction -v 2>&1 | tee evidence/tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec002-exact-head-evidence
          path: evidence/
