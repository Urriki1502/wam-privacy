name: Phase 8 - Halo2 prototype suite

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  halo2-prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: prototypes/zk_balance_halo2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - name: Move to prototype
        run: |
          pwd
        working-directory: repo/prototypes/zk_balance_halo2

      - name: Format check
        run: cargo fmt --check
        working-directory: repo/prototypes/zk_balance_halo2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: repo/prototypes/zk_balance_halo2

      - name: Test Halo2 constraints and real proofs
        run: cargo test --all-targets --verbose
        working-directory: repo/prototypes/zk_balance_halo2
