name: Phase 8 - Halo2 prototype suite

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  halo2-prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: prototypes/zk_balance_halo2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - name: Regenerate Phase 7 semantic oracle
        run: |
          python3 scripts/generate_phase8f_bridge.py --output /tmp/phase8f-oracle.json
          diff -u prototypes/zk_balance_halo2/bridge/phase8f-oracle.json /tmp/phase8f-oracle.json
        working-directory: repo

      - name: Move to prototype
        run: |
          pwd
        working-directory: repo/prototypes/zk_balance_halo2

      - name: Format check
        run: cargo fmt --check
        working-directory: repo/prototypes/zk_balance_halo2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: repo/prototypes/zk_balance_halo2

      - name: Test Phase 8 constraints, real proofs and differential bridge
        run: >-
          cargo test
          --test balance
          --test anchor
          --test nullifier
          --test proof
          --test bridge
          --verbose
        working-directory: repo/prototypes/zk_balance_halo2
