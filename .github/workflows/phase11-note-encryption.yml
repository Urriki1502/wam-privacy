name: Phase 11 - Shielded key hierarchy and note encryption

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  note-encryption:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --check
        working-directory: repo/prototypes/zk_balance_halo2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: repo/prototypes/zk_balance_halo2

      - name: Key separation and HPKE note encryption tests
        run: cargo test --test note_encryption --verbose
        working-directory: repo/prototypes/zk_balance_halo2
