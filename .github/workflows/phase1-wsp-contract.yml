name: Phase 1 - WSP contract gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wsp-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout pinned WSP implementation
        uses: actions/checkout@v4
        with:
          repository: Urriki1502/wam-silent-payments
          ref: a8522fee9b6eda285998a5ff4a45d6bc4eb991b3
          path: wsp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            wsp/requirements-dev.txt
            wsp/requirements-lock.txt

      - name: Install pinned development dependencies
        working-directory: wsp
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-build-isolation . ./integration-deps/wam-sdk

      - name: Formatting
        working-directory: wsp
        run: python -m ruff format --check src devtools tests fuzz benchmarks examples scripts

      - name: Lint
        working-directory: wsp
        run: python -m ruff check src devtools tests fuzz benchmarks examples scripts

      - name: Internal self-test
        working-directory: wsp
        run: python -m devtools.selftest

      - name: Black-box WSP contract
        working-directory: wsp
        run: |
          mkdir -p reports
          python -m wam_sp.conformance test \
            --contract-only \
            --output reports/phase1-contract.json

      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-wsp-contract
          path: wsp/reports/phase1-contract.json
          if-no-files-found: warn
