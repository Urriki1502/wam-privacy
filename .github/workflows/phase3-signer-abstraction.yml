name: Phase 3 - Signer abstraction

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signer-abstraction:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile signer reference contract
        run: |
          python -m py_compile             prototypes/signer_abstraction/__init__.py             prototypes/signer_abstraction/model.py             prototypes/signer_abstraction/provider.py             tests/test_phase3_signer_abstraction.py

      - name: Run signer abstraction tests
        run: |
          python -m unittest -v tests/test_phase3_signer_abstraction.py
