name: V2-05 - Reproducible evidence and maintainer handoff

on:
  push:
    branches:
      - v2/05-qualification-handoff
  pull_request:
    paths:
      - 'v2/**'
      - 'docs/v2/**'
      - '.github/workflows/v2-05-qualification.yml'
      - '.github/workflows/v2-04-v1-bridge.yml'
      - 'scripts/build_phase15_review_package.py'
      - 'scripts/run_phase15f_v1_final_audit.py'
  workflow_dispatch:

concurrency:
  group: v2-05-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  v2-05-two-clean-clones:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Independent immutable source checkout A
        uses: actions/checkout@v4
        with:
          path: v2-05-a
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Independent immutable source checkout B
        uses: actions/checkout@v4
        with:
          path: v2-05-b
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact clone commit and provenance
        run: |
          test "$(git -C v2-05-a rev-parse HEAD)" = "$(git -C v2-05-b rev-parse HEAD)"
          test -z "$(git -C v2-05-a status --porcelain)"
          test -z "$(git -C v2-05-b status --porcelain)"
          git -C v2-05-a merge-base --is-ancestor f7914ef9ee9815c573f5bf5c08dc9785deeee231 HEAD
          git -C v2-05-a diff --exit-code 95dfe0abf04b4e4dcbdbe9eb6d9bd0439a45a127 HEAD -- prototypes/zk_balance_halo2/ integration/core/ tests/ scripts/phase14d_static_review.py scripts/build_phase14d_ledger.py
      - name: Run existing V2 research tests in clean clone A
        working-directory: v2-05-a
        env:
          PYTHONPATH: 'v2:prototypes'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B -m unittest -v v2.test_policy v2.test_disclosure v2.test_routing v2.test_bridge v2.test_qualification
      - name: Independently reproduce V2 research tests in clone B
        working-directory: v2-05-b
        env:
          PYTHONPATH: 'v2:prototypes'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B -m unittest -v v2.test_policy v2.test_disclosure v2.test_routing v2.test_bridge v2.test_qualification
      - name: Generate bounded reproducible evidence manifests
        run: |
          python3 -B v2-05-a/v2/qualify_v2.py --root v2-05-a --peer v2-05-b --output "$RUNNER_TEMP/v2-05-a.json"
          python3 -B v2-05-b/v2/qualify_v2.py --root v2-05-b --peer v2-05-a --output "$RUNNER_TEMP/v2-05-b.json"
          diff -u "$RUNNER_TEMP/v2-05-a.json" "$RUNNER_TEMP/v2-05-b.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "v2-05-a.json").read_text())
          assert report["case_summary"]["cases"] == 29
          assert report["root_derivation_core_003"] == "BLOCKED"
          assert report["production"] == "BLOCKED"
          assert report["mainnet_activation"] == "NOT_AUTHORIZED"
          assert report["independent_clean_checkout_count"] == 2
          assert report["ci_verdict"].startswith("NOT_SELF_ATTESTED")
          print("V2-05 research evidence index reproduced without production claims")
          PY
      - name: Upload research-only local evidence index
        uses: actions/upload-artifact@v4
        with:
          name: v2-05-local-qualification-evidence
          path: ${{ runner.temp }}/v2-05-a.json
          if-no-files-found: error
          retention-days: 90

  p0-independent-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Historical freeze audit and review package at exact HEAD
        run: |
          python3 scripts/run_phase15f_v1_final_audit.py --root . --output "$RUNNER_TEMP/p0-freeze-audit.json"
          python3 scripts/build_phase15_review_package.py --root . --output "$RUNNER_TEMP/p0-review-manifest.json"
      - name: Offline regression at exact research HEAD
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B v2/p0_regression/run_baseline.py --output "$RUNNER_TEMP/p0-baseline.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-baseline-evidence
          path: |
            ${{ runner.temp }}/p0-baseline.json
            ${{ runner.temp }}/p0-freeze-audit.json
            ${{ runner.temp }}/p0-review-manifest.json
          if-no-files-found: error
  p0-independent-lane-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: A
            source_sha: 4f2a81acb66bfe35ae2ea0ec878e21f608f76130
            modules: v2.sec001_research.test_durable_policy
            pythonpath: 'v2:prototypes:.'
          - lane: B
            source_sha: 059658db638229abac23f077e9318466bf501a63
            modules: v2.sec002_research.test_journal tests.test_phase3_signer_abstraction
            pythonpath: 'v2:prototypes:.'
          - lane: C
            source_sha: 4bcca5aa333c9b98ff936a269afecf315e492504
            modules: v2.sec003_research.test_contract v2.sec003_research.test_composition
            pythonpath: 'v2:prototypes:.'
          - lane: D
            source_sha: c1bb25fdf1f16a710901a570f51846fb5be2f644
            modules: v2.auth001_research.test_boundary v2.test_policy v2.test_disclosure
            pythonpath: 'v2:v2/auth001_research:prototypes:.'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable lane source and frozen baseline
        env:
          SOURCE_SHA: ${{ matrix.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code 5af86cfd5be27a3275079cbccde2abd2366ebb2b HEAD -- prototypes/ integration/ tests/ v2/policy.py v2/disclosure.py v2/bridge.py v2/routing.py
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-head.txt
      - name: Historical lane freeze audit and review package
        run: |
          python3 scripts/run_phase15f_v1_final_audit.py --root . --output evidence/freeze-audit.json
          python3 scripts/build_phase15_review_package.py --root . --output evidence/review-manifest.json
      - name: Checkout C pinned A dependency
        if: matrix.lane == 'C'
        uses: actions/checkout@v4
        with:
          ref: 4f2a81acb66bfe35ae2ea0ec878e21f608f76130
          path: dependencies/a
          persist-credentials: false
      - name: Checkout C pinned B dependency
        if: matrix.lane == 'C'
        uses: actions/checkout@v4
        with:
          ref: 059658db638229abac23f077e9318466bf501a63
          path: dependencies/b
          persist-credentials: false
      - name: Verify C dependencies and stage only research adapters
        if: matrix.lane == 'C'
        run: |
          test "$(git -C dependencies/a rev-parse HEAD)" = "4f2a81acb66bfe35ae2ea0ec878e21f608f76130"
          test "$(git -C dependencies/b rev-parse HEAD)" = "059658db638229abac23f077e9318466bf501a63"
          cp -R dependencies/a/v2/sec001_research v2/
          cp -R dependencies/b/v2/sec002_research v2/
          git -C dependencies/a rev-parse HEAD > evidence/A-head.txt
          git -C dependencies/b rev-parse HEAD > evidence/B-head.txt
      - name: Separately reproduce lane tests
        env:
          PYTHONPATH: ${{ matrix.pythonpath }}
          PYTHONDONTWRITEBYTECODE: '1'
          TEST_MODULES: ${{ matrix.modules }}
        run: |
          set -o pipefail
          python3 -B -m unittest -v $TEST_MODULES 2>&1 | tee evidence/tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-lane-${{ matrix.lane }}
          path: evidence/
          if-no-files-found: error
