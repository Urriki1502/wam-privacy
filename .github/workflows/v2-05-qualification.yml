name: V2-05 - Reproducible evidence and maintainer handoff

on:
  push:
    branches:
      - v2/05-qualification-handoff
  pull_request:
    paths:
      - 'v2/**'
      - 'docs/v2/**'
      - '.github/workflows/v2-05-qualification.yml'
      - '.github/workflows/v2-04-v1-bridge.yml'
      - 'scripts/build_phase15_review_package.py'
      - 'scripts/run_phase15f_v1_final_audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-05-two-clean-clones:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Independent immutable source checkout A
        uses: actions/checkout@v4
        with:
          path: v2-05-a
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Independent immutable source checkout B
        uses: actions/checkout@v4
        with:
          path: v2-05-b
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact clone commit and provenance
        run: |
          test "$(git -C v2-05-a rev-parse HEAD)" = "$(git -C v2-05-b rev-parse HEAD)"
          test -z "$(git -C v2-05-a status --porcelain)"
          test -z "$(git -C v2-05-b status --porcelain)"
          git -C v2-05-a merge-base --is-ancestor f7914ef9ee9815c573f5bf5c08dc9785deeee231 HEAD
          git -C v2-05-a diff --exit-code 95dfe0abf04b4e4dcbdbe9eb6d9bd0439a45a127 HEAD -- prototypes/zk_balance_halo2/ integration/core/ tests/ scripts/phase14d_static_review.py scripts/build_phase14d_ledger.py
      - name: Run existing V2 research tests in clean clone A
        working-directory: v2-05-a
        env:
          PYTHONPATH: 'v2:prototypes'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B -m unittest -v v2.test_policy v2.test_disclosure v2.test_routing v2.test_bridge v2.test_qualification
      - name: Independently reproduce V2 research tests in clone B
        working-directory: v2-05-b
        env:
          PYTHONPATH: 'v2:prototypes'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B -m unittest -v v2.test_policy v2.test_disclosure v2.test_routing v2.test_bridge v2.test_qualification
      - name: Validate Step 04 Core interface proposal and source trust boundaries A
        working-directory: v2-05-a
        run: |
          python3 -B v2/core003_research/test_step04_review.py
      - name: Validate Step 04 design and decisions in independent checkout B
        working-directory: v2-05-b
        run: |
          python3 -B v2/core003_research/test_step04_review.py
      - name: Generate bounded reproducible evidence manifests
        run: |
          python3 -B v2-05-a/v2/qualify_v2.py --root v2-05-a --peer v2-05-b --output "$RUNNER_TEMP/v2-05-a.json"
          python3 -B v2-05-b/v2/qualify_v2.py --root v2-05-b --peer v2-05-a --output "$RUNNER_TEMP/v2-05-b.json"
          diff -u "$RUNNER_TEMP/v2-05-a.json" "$RUNNER_TEMP/v2-05-b.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "v2-05-a.json").read_text())
          assert report["case_summary"]["cases"] == 29
          assert report["root_derivation_core_003"] == "BLOCKED"
          assert report["production"] == "BLOCKED"
          assert report["mainnet_activation"] == "NOT_AUTHORIZED"
          assert report["independent_clean_checkout_count"] == 2
          assert report["ci_verdict"].startswith("NOT_SELF_ATTESTED")
          print("V2-05 research evidence index reproduced without production claims")
          PY
      - name: Upload research-only local evidence index
        uses: actions/upload-artifact@v4
        with:
          name: v2-05-local-qualification-evidence
          path: ${{ runner.temp }}/v2-05-a.json
          if-no-files-found: error
          retention-days: 90

  core003-ordered-root-reference-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact research PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned frozen V1 Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
      - name: Reject changes to frozen V1 implementation and Core
        run: |
          git merge-base --is-ancestor 5af86cfd5be27a3275079cbccde2abd2366ebb2b HEAD
          git diff --exit-code 95dfe0abf04b4e4dcbdbe9eb6d9bd0439a45a127 HEAD -- prototypes/zk_balance_halo2/ integration/core/ tests/ scripts/phase14d_static_review.py scripts/build_phase14d_ledger.py
      - name: Run CORE-003 research fixture against frozen V1 Cargo.lock
        run: |
          # Work entirely in an ephemeral copy: the checkout, frozen V1 files
          # and protected Git tree are never modified.
          cp -a prototypes/zk_balance_halo2 "$RUNNER_TEMP/core003-reference"
          cp v2/core003_research/src/lib.rs "$RUNNER_TEMP/core003-reference/tests/core003_reference.rs"
          cp v2/core003_research/tests/core003_step02.rs "$RUNNER_TEMP/core003-reference/tests/core003_step02.rs"
          cp v2/core003_research/tests/core003_step03.rs "$RUNNER_TEMP/core003-reference/tests/core003_step03.rs"
          cargo test --locked --manifest-path "$RUNNER_TEMP/core003-reference/Cargo.toml" --test core003_reference --verbose
      - name: Step 02 differential WalletScanner tests and candidate vector output A
        run: |
          cargo test --locked --manifest-path "$RUNNER_TEMP/core003-reference/Cargo.toml" --test core003_step02 -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/core003-step02-a.log"
          grep '^CORE003_VECTOR ' "$RUNNER_TEMP/core003-step02-a.log" > "$RUNNER_TEMP/core003-vectors-a.txt"
          test "$(wc -l < "$RUNNER_TEMP/core003-vectors-a.txt")" -eq 5
          cat "$RUNNER_TEMP/core003-vectors-a.txt"
      - name: Independent repeat from clean frozen V1 Cargo.lock
        run: |
          cp -a prototypes/zk_balance_halo2 "$RUNNER_TEMP/core003-reference-b"
          cp v2/core003_research/src/lib.rs "$RUNNER_TEMP/core003-reference-b/tests/core003_reference.rs"
          cp v2/core003_research/tests/core003_step02.rs "$RUNNER_TEMP/core003-reference-b/tests/core003_step02.rs"
          cp v2/core003_research/tests/core003_step03.rs "$RUNNER_TEMP/core003-reference-b/tests/core003_step03.rs"
          cargo test --locked --manifest-path "$RUNNER_TEMP/core003-reference-b/Cargo.toml" --test core003_step02 -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/core003-step02-b.log"
          grep '^CORE003_VECTOR ' "$RUNNER_TEMP/core003-step02-b.log" > "$RUNNER_TEMP/core003-vectors-b.txt"
          test "$(wc -l < "$RUNNER_TEMP/core003-vectors-b.txt")" -eq 5
          diff -u "$RUNNER_TEMP/core003-vectors-a.txt" "$RUNNER_TEMP/core003-vectors-b.txt"
          sha256sum "$RUNNER_TEMP/core003-vectors-a.txt"
      - name: Step 03 atomic persistence and reorg crash-injection research A
        run: |
          cargo test --locked --manifest-path "$RUNNER_TEMP/core003-reference/Cargo.toml" --test core003_step03 -- --test-threads=1
      - name: Step 03 clean second-copy persistence regression B
        run: |
          cargo test --locked --manifest-path "$RUNNER_TEMP/core003-reference-b/Cargo.toml" --test core003_step03 -- --test-threads=1
      - name: Upload bounded Step 02 candidate vectors
        uses: actions/upload-artifact@v4
        with:
          name: core003-step02-research-root-vectors
          path: ${{ runner.temp }}/core003-vectors-a.txt
          if-no-files-found: error
          retention-days: 90
      - name: Verify frozen source checkout remained clean
        run: |
          test -z "$(git status --porcelain)"
