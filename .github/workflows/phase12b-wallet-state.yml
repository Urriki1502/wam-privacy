name: Phase 12B - Shielded wallet state

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shielded-wallet-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - name: Format check
        working-directory: repo/prototypes/zk_balance_halo2
        run: cargo fmt --check

      - name: Clippy
        working-directory: repo/prototypes/zk_balance_halo2
        run: cargo clippy --all-targets -- -D warnings

      - name: Test shielded scanner, witnesses, recovery and reorg
        working-directory: repo/prototypes/zk_balance_halo2
        run: cargo test --test wallet_state --verbose
