name: V2 AUTH001 Research
on:
  pull_request:
    paths:
      - 'v2/auth001_research/**'
      - 'docs/v2/AUTH001*'
      - '.github/workflows/v2-auth001-research.yml'
  push:
    branches: ['research/auth001-boundary-review']
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact HEAD defensive regression
        env:
          PYTHONPATH: v2:v2/auth001_research
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/head.txt
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          set -o pipefail
          python -m unittest discover -s v2/auth001_research -p 'test_*.py' -v 2>&1 | tee evidence/boundary.txt
          python -m unittest discover -s v2 -p 'test_policy.py' -v 2>&1 | tee evidence/policy.txt
          python -m unittest discover -s v2 -p 'test_disclosure.py' -v 2>&1 | tee evidence/disclosure.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth001-exact-head-evidence
          path: evidence/
